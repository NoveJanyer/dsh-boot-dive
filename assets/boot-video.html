<div data-dsh-boot-dive data-dsbdv data-dur="{{DUR}}" data-tail="{{TAIL}}" data-cap="{{CAP}}" data-skip="{{SKIP}}" data-sound="{{SOUND}}" role="status" aria-label="DeepSeek Harness 正在启动">
	<video class="dsbdv-video" src="{{VIDEO}}" playsinline preload="auto" disablepictureinpicture></video>
	<div class="dsbdv-veil" aria-hidden="true"></div>
	<div class="dsbdv-scan" aria-hidden="true"></div>

	<div class="dsbdv-readout" aria-hidden="true">
		<span class="dsbdv-phase">唤醒中</span>
		<span class="dsbdv-pct">0<i>%</i></span>
	</div>

	<div class="dsbdv-skip" aria-hidden="true">点击任意处 或 ESC 跳过</div>

	<div class="dsbdv-meter" aria-hidden="true"><i></i></div>

	<div class="dsbdv-flash" aria-hidden="true"></div>
</div>
